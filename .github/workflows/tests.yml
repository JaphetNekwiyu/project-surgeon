name: Project Surgeon checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manifests and 12 skills
        run: python scripts/check_plugin.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Python compilation
        run: python -m compileall -q scripts plugins/project-surgeon/skills/project-surgeon/scripts tests
